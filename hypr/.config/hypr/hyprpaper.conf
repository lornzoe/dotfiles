# Fallback wallpaper daemon. Used when `awww` (ex-swww) is not installed.
# Absolute paths only -- hyprpaper does not expand ~ reliably in all versions,
# and the old config's relative `dotfiles/hypr/...` path silently did nothing
# unless Hyprland happened to be started from $HOME.
preload = ~/.config/hypr/wallpapers/my-neighbor-totoro-sunflowers.png

wallpaper = DP-5, ~/.config/hypr/wallpapers/my-neighbor-totoro-sunflowers.png
wallpaper = HDMI-A-2, ~/.config/hypr/wallpapers/my-neighbor-totoro-sunflowers.png

splash = false
ipc = on
